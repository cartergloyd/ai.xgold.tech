name: homelab-crm
services:
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: homelab-crm-redis
    restart: unless-stopped
    command: [redis-server, --maxmemory, 96mb, --maxmemory-policy, noeviction, --save, '60', '1']
    mem_limit: 128m
    memswap_limit: 128m
    volumes: [./redis:/data]
    networks: [crm]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  server:
    image: twentycrm/twenty:v2.50.0@sha256:172f8d08faedc5916ec9b531538f1192863b8c581074dfd63ffe3347b215d569
    container_name: homelab-twenty
    restart: unless-stopped
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 1.5
    environment: &environment
      NODE_PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=768
      PG_DATABASE_URL: postgres://crm:${CRM_DB_PASSWORD}@gold-platform-postgres:5432/crm
      SERVER_URL: https://crm.xgold.tech
      REDIS_URL: redis://homelab-crm-redis:6379
      ENCRYPTION_KEY: ${CRM_ENCRYPTION_KEY}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: 'false'
      DISABLE_CRON_JOBS_REGISTRATION: 'false'
      EMAIL_DRIVER: logger
      IS_MULTIWORKSPACE_ENABLED: 'false'
    ports: ['127.0.0.1:3020:3000']
    volumes: [./local-storage:/app/packages/twenty-server/.local-storage]
    networks: [crm, platform]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null']
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 12
  worker:
    image: twentycrm/twenty:v2.50.0@sha256:172f8d08faedc5916ec9b531538f1192863b8c581074dfd63ffe3347b215d569
    container_name: homelab-twenty-worker
    restart: unless-stopped
    command: [yarn, worker:prod]
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1
    environment:
      <<: *environment
      NODE_OPTIONS: --max-old-space-size=640
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes: [./local-storage:/app/packages/twenty-server/.local-storage]
    networks: [crm, platform]
    depends_on:
      server:
        condition: service_healthy
  umami:
    # Built with BASE_PATH=/stats by .github/workflows/build-umami.yml in the site repo;
    # pulled, not built, so the RAM-limited host never runs a Next.js build.
    image: ghcr.io/cartergloyd/umami-stats:${UMAMI_VERSION:-v2.19.0}
    container_name: homelab-umami
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@gold-platform-postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: '1'
      TZ: UTC
    ports: ['127.0.0.1:3021:3000']
    networks: [platform]
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://127.0.0.1:3000/stats/api/heartbeat >/dev/null']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
networks:
  crm: {}
  platform:
    external: true
    name: server-platform_default
