name: Build Umami image (BASE_PATH=/stats)

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-umami.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Umami git tag to build
        default: v2.19.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: umami-software/umami
          ref: ${{ inputs.version || 'v2.19.0' }}
          path: umami
      - name: Pin the package manager for this Umami release
        run: sed -i 's/npm install -g pnpm$/npm install -g pnpm@9.15.9/' umami/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./umami
          build-args: |
            BASE_PATH=/stats
            DATABASE_TYPE=postgresql
          push: true
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/umami-stats:${{ inputs.version || 'v2.19.0' }}
      - name: Export prebuilt image for hosts without GHCR credentials
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/umami-stats:${{ inputs.version || 'v2.19.0' }}
        run: docker save "$IMAGE" | gzip > umami-stats.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: umami-stats-image
          path: umami-stats.tar.gz
          retention-days: 7
          compression-level: 0
